intro: >-
  The Jay Phillips Center Scholars in Interreligious Studies program brings
  together a small group of exceptional emerging scholars each year for
  mentorship, scholarly development, public engagement, and field-building.
  Fellows work closely with distinguished Senior Scholars-in-Residence and
  become part of a multi-generational network shaping the future of
  Interreligious Studies.

gatherings:
  - title: Virtual community
    text: >-
      About 3 hours a month of cohort dialogue, research exchange, and peer
      coaching, plus one-on-one mentorship with the senior scholars.
  - title: AAR & AIIS
    text: >-
      Scholars attend the AAR Annual Meeting and AIIS events, with support in
      finding a venue to share their work.
  - title: Residency at St. Thomas
    text: >-
      Four funded days in St. Paul presenting to public, community, and
      academic audiences, with cohort workshops and pedagogy sessions.
